name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-assignment-3:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-assignment-3:latest

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/fastapi-assignment-3:${{ github.sha }}"
            sudo docker pull "$IMAGE"
            sudo docker rm -f fastapi-demo || true
            sudo docker run -d \
              --name fastapi-demo \
              --restart unless-stopped \
              -p 80:8000 \
              "$IMAGE"

      - name: Check health endpoint
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
              "http://${{ secrets.EC2_HOST }}/health"; then
              exit 0
            fi
            echo "Health check failed; retrying ($attempt/12)"
            sleep 5
          done
          echo "Health check did not succeed"
          exit 1